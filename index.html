<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1111bet - Casino & Games</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #1e1e1e;
        }
        .logo {
            color: #facc15;
            font-weight: bold;
            font-size: 24px;
        }
        .balance-box {
            background: #2a2a2a;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #facc15;
        }
        .container {
            padding: 10px;
        }
        .section-title {
            color: #facc15;
            font-size: 16px;
            margin: 15px 0 10px 0;
            font-weight: bold;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .game-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 8px;
        }
        .game-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
        }
        .game-card h3 {
            font-size: 12px;
            margin: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }
        .play-btn {
            background: #facc15;
            color: #000;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        /* বেটিং হিস্ট্রি সেকশন স্টাইল */
        .history-container {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none; /* ডিফল্টভাবে হাইড থাকবে */
        }
        .history-item {
            background: #2a2a2a;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e1e1e;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #333;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
        }
        .nav-item.active {
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">1111bet</div>
        <div class="balance-box">👤 VIP1 | 💰 <span id="user-balance">188728</span> ৳</div>
    </div>

    <div class="container">
        <div class="section-title">🔥 গরম খেলা (Popular Games)</div>
        
        <div class="game-grid">
            <!-- Game 1: Aviator -->
            <div class="game-card">
                <img src="https://images.unsplash.com/photo-1518609878373-06d740f60d8b" alt="Aviator">
                <h3>এভিয়েটর</h3>
                <button class="play-btn" onclick="launchGame('aviator', 'aviator_game')">PLAY NOW</button>
            </div>

            <!-- Game 2: Super Ace -->
            <div class="game-card">
                <img src="https://images.unsplash.com/photo-1511193311914-0346f16efe90" alt="Super Ace">
                <h3>সুপার এস</h3>
                <button class="play-btn" onclick="launchGame('jili', 'super_ace')">PLAY NOW</button>
            </div>

            <!-- Game 3: Boxing King -->
            <div class="game-card">
                <img src="https://images.unsplash.com/photo-1596838132731-3301c3fd4317" alt="Boxing King">
                <h3>বক্সিং কিং</h3>
                <button class="play-btn" onclick="launchGame('jili', 'boxing_king')">PLAY NOW</button>
            </div>
        </div>

        <!-- বেটিং হিস্ট্রি বা স্টোরি সেকশন -->
        <div id="history-section" class="history-container">
            <div class="section-title" style="margin-top:0;">📊 আপনার বেটিং স্টোরি (Betting History)</div>
            <div id="history-list">
                <div class="history-item">
                    <span>এভিয়েটর (Aviator) - Bet: 100৳</span>
                    <span style="color: #4ade80;">Win: +250৳</span>
                </div>
                <div class="history-item">
                    <span>সুপার এস (Super Ace) - Bet: 50৳</span>
                    <span style="color: #f87171;">Loss: -50৳</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-item active" onclick="showSection('games')">🏠 হোম</div>
        <div class="nav-item" onclick="alert('ডিপোজিট পেজ')">💰 ডিপোজিট</div>
        <div class="nav-item" onclick="toggleHistory()">📋 স্টোরি</div>
        <div class="nav-item" onclick="alert('উত্তোলন পেজ')">💸 উত্তোলন</div>
        <div class="nav-item" onclick="alert('সদস্য অ্যাকাউন্ট')">👤 সদস্য</div>
    </div>

    <script>
        // আপনার রেন্ডার ব্যাকএন্ড সার্ভারের লাইভ ইউআরএল এখানে বসাবেন
        const BACKEND_URL = "https://your-backend-service.onrender.com"; 

        async function launchGame(providerCode, gameSymbol) {
            alert("ക্যাসিনো সার্ভার কানেক্ট হচ্ছে...");
            try {
                const response = await fetch(`${BACKEND_URL}/api/launch-game`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_code: "user_188728",
                        provider_code: providerCode,
                        game_symbol: gameSymbol,
                        lang: "bn",
                        return_url: window.location.href
                    })
                });

                const data = await response.json();
                
                if (data && data.url) {
                    window.location.href = data.url;
                } else {
                    alert("গেম লঞ্চ ব্যর্থ হয়েছে: সিস্টেমে সমস্যা রয়েছে।");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("সার্ভার কানেকশন এরর! দয়া করে ব্যাকএন্ড ইউআরএল চেক করুন।");
            }
        }

        // বেটিং হিস্ট্রি টগল করার ফাংশন
        function toggleHistory() {
            const historySec = document.getElementById('history-section');
            if (historySec.style.display === 'none' || historySec.style.display === '') {
                historySec.style.display = 'block';
            } else {
                historySec.style.display = 'none';
            }
        }
    </script>
</body>
</html>
