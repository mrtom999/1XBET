<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xbet - Agent Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box, .container {
            width: 100%;
            max-width: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .container {
            display: none;
            max-width: 600px;
        }
        h2 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 10px;
        }
        .card {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        h3 {
            font-size: 15px;
            color: #ffcc00;
            margin-bottom: 12px;
        }
        .balance-box {
            background-color: #21262d;
            border: 1px solid #ffcc00;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .balance-box span {
            color: #ffcc00;
            font-size: 18px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #8b949e;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #ffcc00;
            outline: none;
        }
        .btn {
            background: linear-gradient(to bottom, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #ffea00, #ff9900);
        }
        .error-msg {
            color: #d32f2f;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #30363d;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #21262d;
            color: #ffcc00;
        }
    </style>

    <!-- ফায়ারবেস SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- এজেন্ট লগইন স্ক্রিন -->
    <div class="login-box" id="loginSection">
        <h2>⚡ Agent Login</h2>
        <div class="form-group">
            <label>এজেন্ট আইডি:</label>
            <input type="text" id="agentUsername" placeholder="যেমন: RH45">
        </div>
        <div class="form-group">
            <label>নির্দিষ্ট পাসওয়ার্ড:</label>
            <input type="password" id="agentPassword" placeholder="পাসওয়ার্ড দিন">
        </div>
        <button class="btn" onclick="agentLogin()">লগইন করুন</button>
        <div class="error-msg" id="loginError"></div>
    </div>

    <!-- এজেন্ট ড্যাশবোর্ড -->
    <div class="container" id="dashboardSection">
        <h2>⚡ 1xbet Agent Control Panel</h2>

        <div class="balance-box">
            এজেন্ট আইডি: <span id="agentIdDisplay">RH45</span>
        </div>

        <!-- নতুন আইডি তৈরি সেকশন -->
        <div class="card">
            <h3>নতুন ইউজার আইডি ও পাসওয়ার্ড তৈরি করুন</h3>
            <div class="form-group">
                <label>ইউজার নাম / আইডি:</label>
                <input type="text" id="agentUser" placeholder="যেমন: player_rahim">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড:</label>
                <input type="text" id="agentPass" placeholder="যেমন: pass1234">
            </div>
            <div class="form-group">
                <label>পয়েন্ট পরিমাণ:</label>
                <input type="number" id="agentPoints" placeholder="যেমন: 1000">
            </div>
            <button class="btn" onclick="createAccount()">আইডি তৈরি করুন</button>
        </div>

        <!-- ইউজার ব্যালেন্স যোগ বা কেটে নেওয়ার সেকশন -->
        <div class="card">
            <h3>ইউজারের ব্যালেন্স অ্যাড বা কেটে নিন</h3>
            <div class="form-group">
                <label>ইউজার আইডি:</label>
                <input type="text" id="targetUser" placeholder="ইউজার আইডি দিন">
            </div>
            <div class="form-group">
                <label>অপারেশন সিলেক্ট করুন:</label>
                <select id="actionType">
                    <option value="add">পয়েন্ট যোগ করুন (Deposit)</option>
                    <option value="sub">পয়েন্ট কেটে নিন (Withdraw)</option>
                </select>
            </div>
            <div class="form-group">
                <label>পয়েন্ট পরিমাণ:</label>
                <input type="number" id="targetPoints" placeholder="পরিমাণ দিন">
            </div>
            <button class="btn" onclick="updateUserBalance()">ব্যালেন্স আপডেট করুন</button>
        </div>

        <!-- ইউজার পাসওয়ার্ড পরিবর্তনের সেকশন -->
        <div class="card">
            <h3>ইউজারের পাসওয়ার্ড পরিবর্তন করুন</h3>
            <div class="form-group">
                <label>ইউজার আইডি:</label>
                <input type="text" id="passTargetUser" placeholder="ইউজার আইডি দিন">
            </div>
            <div class="form-group">
                <label>নতুন পাসওয়ার্ড:</label>
                <input type="text" id="newPasswordInput" placeholder="নতুন পাসওয়ার্ড দিন">
            </div>
            <button class="btn" onclick="updateUserPassword()">পাসওয়ার্ড পরিবর্তন করুন</button>
        </div>

        <!-- ইউজার লিস্ট ও পাসওয়ার্ড চেক -->
        <div class="card">
            <h3>ইউজার লিস্ট ও ডাটা</h3>
            <table>
                <thead>
                    <tr>
                        <th>ইউজার আইডি</th>
                        <th>পাসওয়ার্ড</th>
                        <th>ব্যালেন্স</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- ফায়ারবেস থেকে ডাটা ডাইনামিক লোড হবে -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDgpnL-J0SxEEZhpjGWTZdpAFTvS1ww9QA",
            authDomain: "xbet-85104.firebaseapp.com",
            projectId: "xbet-85104",
            storageBucket: "xbet-85104.firebasestorage.app",
            messagingSenderId: "839557510948",
            appId: "1:839557510948:web:a80ebd160402b78087e5b1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const correctAgentUser = "RH45";
        const correctAgentPass = "Pass.Rohit@sharma45";

        function agentLogin() {
            const user = document.getElementById('agentUsername').value.trim();
            const pass = document.getElementById('agentPassword').value.trim();
            const errorBox = document.getElementById('loginError');

            if (user === correctAgentUser && pass === correctAgentPass) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadUsersTable();
            } else {
                errorBox.innerText = "ভুল এজেন্ট আইডি অথবা পাসওয়ার্ড!";
            }
        }

        // ফায়ারবেসে নতুন ইউজার অ্যাকাউন্ট সেভ করা
        function createAccount() {
            const user = document.getElementById('agentUser').value.trim();
            const pass = document.getElementById('agentPass').value.trim();
            const points = Number(document.getElementById('agentPoints').value);

            if(!user || !pass || isNaN(points)) {
                alert("সবগুলো ঘর সঠিকভাবে পূরণ করুন!");
                return;
            }

            db.collection("users").add({
                username: user,
                password: pass,
                balance: points,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert(`সফল! ইউজার আইডি: ${user} তৈরি করা হয়েছে।`);
                document.getElementById('agentUser').value = "";
                document.getElementById('agentPass').value = "";
                document.getElementById('agentPoints').value = "";
                loadUsersTable(); // লিস্ট রিফ্রেশ করবে
            })
            .catch((error) => {
                alert("এরর: " + error.message);
            });
        }

        // ব্যালেন্স যোগ বা কেটে নেওয়া
        function updateUserBalance() {
            const targetUser = document.getElementById('targetUser').value.trim();
            const actionType = document.getElementById('actionType').value;
            const points = Number(document.getElementById('targetPoints').value);

            if (!targetUser || isNaN(points) || points <= 0) {
                alert("সঠিক ইউজার আইডি এবং পয়েন্টের পরিমাণ দিন!");
                return;
            }

            db.collection("users").where("username", "==", targetUser).get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    alert("এই নামের কোনো ইউজার পাওয়া যায়নি!");
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const currentBalance = Number(doc.data().balance || 0);
                    let newBalance = actionType === 'add' ? currentBalance + points : currentBalance - points;

                    if (newBalance < 0) {
                        alert("ইউজারের পর্যাপ্ত ব্যালেন্স নেই!");
                        return;
                    }

                    db.collection("users").doc(doc.id).update({
                        balance: newBalance
                    })
                    .then(() => {
                        alert(`সফল! নতুন ব্যালেন্স: ${newBalance} পয়েন্ট`);
                        document.getElementById('targetUser').value = "";
                        document.getElementById('targetPoints').value = "";
                        loadUsersTable();
                    });
                });
            });
        }

        // পাসওয়ার্ড পরিবর্তন করা
        function updateUserPassword() {
            const targetUser = document.getElementById('passTargetUser').value.trim();
            const newPass = document.getElementById('newPasswordInput').value.trim();

            if (!targetUser || !newPass) {
                alert("ইউজার আইডি এবং নতুন পাসওয়ার্ড দিন!");
                return;
            }

            db.collection("users").where("username", "==", targetUser).get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    alert("এই নামের কোনো ইউজার পাওয়া যায়নি!");
                    return;
                }

                querySnapshot.forEach((doc) => {
                    db.collection("users").doc(doc.id).update({
                        password: newPass
                    })
                    .then(() => {
                        alert(`সফল! ${targetUser} এর পাসওয়ার্ড পরিবর্তন করা হয়েছে।`);
                        document.getElementById('passTargetUser').value = "";
                        document.getElementById('newPasswordInput').value = "";
                        loadUsersTable();
                    });
                });
            });
        }

        // ডাটাবেজ থেকে ইউজার টেবিল লোড করা
        function loadUsersTable() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";

            db.collection("users").get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data.username}</td>
                        <td>${data.password}</td>
                        <td>${data.balance || 0} পয়েন্ট</td>
                    `;
                    tbody.appendChild(tr);
                });
            }).catch((error) => {
                console.error("টেবিল লোড করতে সমস্যা হচ্ছে: ", error);
            });
        }
    </script>
</body>
</html>
