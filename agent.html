<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xbet - Agent Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box, .container {
            width: 100%;
            max-width: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .container {
            display: none;
            max-width: 600px;
        }
        h2 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 10px;
        }
        .card {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        h3 {
            font-size: 15px;
            color: #ffcc00;
            margin-bottom: 12px;
        }
        .balance-box {
            background-color: #21262d;
            border: 1px solid #ffcc00;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .balance-box span {
            color: #ffcc00;
            font-size: 18px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            border-color: #ffcc00;
            outline: none;
        }
        .btn {
            background: linear-gradient(to bottom, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #ffea00, #ff9900);
        }
        .error-msg {
            color: #d32f2f;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #30363d;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #21262d;
            color: #ffcc00;
        }
        .win { color: #238636; font-weight: bold; }
        .loss { color: #d32f2f; font-weight: bold; }
    </style>

    <!-- ফায়ারবেস SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- এজেন্ট লগইন স্ক্রিন -->
    <div class="login-box" id="loginSection">
        <h2>⚡ Agent Login</h2>
        <div class="form-group">
            <label>এজেন্ট আইডি:</label>
            <input type="text" id="agentUsername" placeholder="যেমন: RH45">
        </div>
        <div class="form-group">
            <label>নির্দিষ্ট পাসওয়ার্ড:</label>
            <input type="password" id="agentPassword" placeholder="পাসওয়ার্ড দিন">
        </div>
        <button class="btn" onclick="agentLogin()">লগইন করুন</button>
        <div class="error-msg" id="loginError"></div>
    </div>

    <!-- এজেন্ট ড্যাশবোর্ড -->
    <div class="container" id="dashboardSection">
        <h2>⚡ 1xbet Agent Control Panel</h2>

        <!-- এজেন্টের নিজের পয়েন্ট দেখার বক্স -->
        <div class="balance-box">
            এজেন্টের বর্তমান ব্যালেন্স / পয়েন্ট: <span id="agentCurrentBalance">৫০,০০০ পয়েন্ট</span>
        </div>

        <!-- নতুন আইডি তৈরি সেকশন -->
        <div class="card">
            <h3>নতুন ইউজার আইডি ও পাসওয়ার্ড তৈরি করুন</h3>
            <div class="form-group">
                <label>ইউজার নাম / আইডি:</label>
                <input type="text" id="agentUser" placeholder="যেমন: player_rahim">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড:</label>
                <input type="text" id="agentPass" placeholder="যেমন: pass1234">
            </div>
            <div class="form-group">
                <label>পয়েন্ট পরিমাণ:</label>
                <input type="number" id="agentPoints" placeholder="যেমন: 1000">
            </div>
            <button class="btn" onclick="createAccount()">আইডি তৈরি করুন</button>
        </div>

        <!-- ইউজার পাসওয়ার্ড ও ব্যালেন্স লিস্ট (এজেন্ট দেখতে পারবে) -->
        <div class="card">
            <h3>ইউজার লিস্ট ও পাসওয়ার্ড চেক</h3>
            <table>
                <tr>
                    <th>ইউজার আইডি</th>
                    <th>পাসওয়ার্ড</th>
                    <th>ব্যালেন্স</th>
                </tr>
                <tr>
                    <td>user_kamal</td>
                    <td>kamal123</td>
                    <td>৫,০০০ পয়েন্ট</td>
                </tr>
                <tr>
                    <td>player_sakib</td>
                    <td>sakib999</td>
                    <td>২,৫০০ পয়েন্ট</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // আপনার সঠিক ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDgpnL-J0SxEEZhpjGWTZdpAFTvS1ww9QA",
            authDomain: "xbet-85104.firebaseapp.com",
            projectId: "xbet-85104",
            storageBucket: "xbet-85104.firebasestorage.app",
            messagingSenderId: "839557510948",
            appId: "1:839557510948:web:a80ebd160402b78087e5b1"
        };

        // ফায়ারবেস এবং ডাটাবেজ ইনিশিয়ালাইজেশন
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const correctAgentUser = "RH45";
        const correctAgentPass = "Pass.Rohit@sharma45";

        function agentLogin() {
            const user = document.getElementById('agentUsername').value;
            const pass = document.getElementById('agentPassword').value;
            const errorBox = document.getElementById('loginError');

            if (user === correctAgentUser && pass === correctAgentPass) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
            } else {
                errorBox.innerText = "ভুল এজেন্ট আইডি অথবা পাসওয়ার্ড!";
            }
        }

        function createAccount() {
            const user = document.getElementById('agentUser').value;
            const pass = document.getElementById('agentPass').value;
            const points = document.getElementById('agentPoints').value;

            if(!user || !pass || !points) {
                alert("সবগুলো ঘর সঠিকভাবে পূরণ করুন!");
                return;
            }

            // চাইলে ফায়ারস্টোর ডাটাবেজে ইউজার সেভ করার কোড এখানে যুক্ত করা যাবে
            alert(`সফল! ইউজার আইডি: ${user}, পাসওয়ার্ড: ${pass} এবং ${points} পয়েন্ট তৈরি করা হয়েছে।`);
            document.getElementById('agentUser').value = "";
            document.getElementById('agentPass').value = "";
            document.getElementById('agentPoints').value = "";
        }
    </script>
</body>
</html>
